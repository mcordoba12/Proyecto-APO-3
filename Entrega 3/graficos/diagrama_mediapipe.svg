<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Título -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f77b4">
    MediaPipe Pose Architecture
  </text>
  
  <!-- Stage 1: Input Video -->
  <rect x="50" y="80" width="120" height="80" fill="#e8f4f8" stroke="#1f77b4" stroke-width="2" rx="5"/>
  <text x="110" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Input Frame</text>
  <text x="110" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">RGB Image</text>
  <text x="110" y="150" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(1080×1920)</text>
  
  <!-- Arrow 1 -->
  <path d="M 170 120 L 220 120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 2: Detector -->
  <rect x="220" y="80" width="140" height="80" fill="#fff4e6" stroke="#ff7f0e" stroke-width="2" rx="5"/>
  <text x="290" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BlazePose</text>
  <text x="290" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Detector</text>
  <text x="290" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">MobileNetV2</text>
  <text x="290" y="153" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Bounding Box</text>
  
  <!-- Arrow 2 -->
  <path d="M 360 120 L 410 120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 3: Landmark Regression -->
  <rect x="410" y="80" width="140" height="80" fill="#e8f5e9" stroke="#2ca02c" stroke-width="2" rx="5"/>
  <text x="480" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Landmark</text>
  <text x="480" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Regression</text>
  <text x="480" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">33 keypoints</text>
  <text x="480" y="153" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(x, y, z, visibility)</text>
  
  <!-- Arrow 3 -->
  <path d="M 550 120 L 600 120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 4: Output -->
  <rect x="600" y="80" width="150" height="80" fill="#f3e5f5" stroke="#9467bd" stroke-width="2" rx="5"/>
  <text x="675" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Pose</text>
  <text x="675" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Landmarks</text>
  <text x="675" y="140" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">33 × (x,y,z)</text>
  <text x="675" y="153" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">= 99 features</text>
  
  <!-- Skeleton visualization -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">33 Body Landmarks:</text>
    
    <!-- Body outline -->
    <circle cx="100" cy="40" r="8" fill="#ff6b6b" stroke="#333"/>
    <text x="120" y="45" font-family="Arial, sans-serif" font-size="10" fill="#666">0: Nose</text>
    
    <circle cx="85" cy="60" r="6" fill="#4ecdc4" stroke="#333"/>
    <circle cx="115" cy="60" r="6" fill="#4ecdc4" stroke="#333"/>
    <text x="120" y="65" font-family="Arial, sans-serif" font-size="10" fill="#666">11-12: Shoulders</text>
    
    <line x1="85" y1="60" x2="85" y2="100" stroke="#333" stroke-width="2"/>
    <line x1="115" y1="60" x2="115" y2="100" stroke="#333" stroke-width="2"/>
    
    <circle cx="85" cy="100" r="6" fill="#95e1d3" stroke="#333"/>
    <circle cx="115" cy="100" r="6" fill="#95e1d3" stroke="#333"/>
    <text x="120" y="105" font-family="Arial, sans-serif" font-size="10" fill="#666">23-24: Hips</text>
    
    <line x1="85" y1="100" x2="75" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="115" y1="100" x2="125" y2="140" stroke="#333" stroke-width="2"/>
    
    <circle cx="75" cy="140" r="6" fill="#f9ca24" stroke="#333"/>
    <circle cx="125" cy="140" r="6" fill="#f9ca24" stroke="#333"/>
    <text x="130" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">25-26: Knees</text>
    
    <line x1="75" y1="140" x2="70" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="125" y1="140" x2="130" y2="170" stroke="#333" stroke-width="2"/>
    
    <circle cx="70" cy="170" r="6" fill="#6c5ce7" stroke="#333"/>
    <circle cx="130" cy="170" r="6" fill="#6c5ce7" stroke="#333"/>
    <text x="135" y="175" font-family="Arial, sans-serif" font-size="10" fill="#666">27-28: Ankles</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(400, 240)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Key Features:</text>
    
    <rect x="0" y="10" width="12" height="12" fill="#4ecdc4"/>
    <text x="20" y="20" font-family="Arial, sans-serif" font-size="11" fill="#666">Upper body (shoulders, elbows, wrists)</text>
    
    <rect x="0" y="30" width="12" height="12" fill="#95e1d3"/>
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="11" fill="#666">Core (hips, spine)</text>
    
    <rect x="0" y="50" width="12" height="12" fill="#f9ca24"/>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="11" fill="#666">Lower body (knees, ankles, feet)</text>
    
    <rect x="0" y="70" width="12" height="12" fill="#ff6b6b"/>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="11" fill="#666">Face (eyes, ears, nose, mouth)</text>
    
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="10" fill="#999">Real-time: >30 FPS on mobile CPU</text>
    <text x="0" y="125" font-family="Arial, sans-serif" font-size="10" fill="#999">Detection confidence: 0.5 threshold</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>